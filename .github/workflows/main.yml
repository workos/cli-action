on: [push]

jobs:
  test_action:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-20.04, macos-latest, windows-latest, windows-2019]
    name: Install the cli
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
      - name: Install CLI
        uses: ./
        id: install
        with:
          version: 'latest'
      - name: Test CLI
        run: workos --version
